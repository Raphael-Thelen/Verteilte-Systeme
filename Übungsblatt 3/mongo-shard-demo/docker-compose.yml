services:
  # Config-Server ReplSet (3 Mitglieder, Port 27019)
  configsvr1:
    image: mongo:6.0
    container_name: configsvr1
    hostname: configsvr1
    command: >
      mongod --configsvr --replSet cfgrs
             --port 27019 --bind_ip_all
    ports:
      - "27019:27019"
    networks:
      - mongo_net

  configsvr2:
    image: mongo:6.0
    container_name: configsvr2
    hostname: configsvr2
    command: >
      mongod --configsvr --replSet cfgrs
             --port 27019 --bind_ip_all
    networks:
      - mongo_net

  configsvr3:
    image: mongo:6.0
    container_name: configsvr3
    hostname: configsvr3
    command: >
      mongod --configsvr --replSet cfgrs
             --port 27019 --bind_ip_all
    networks:
      - mongo_net

  # Shard1 (immer aktiv) – Port 27016
  shard1:
    image: mongo:6.0
    container_name: shard1
    hostname: shard1
    command: >
      mongod --shardsvr --replSet shard1
             --port 27016 --bind_ip_all
    ports:
      - "27016:27016"
    networks:
      - mongo_net

  # Shard2 (optional, Profil ≥2) – Port 27015
  shard2:
    image: mongo:6.0
    container_name: shard2
    hostname: shard2
    command: >
      mongod --shardsvr --replSet shard2
             --port 27015 --bind_ip_all
    ports:
      - "27015:27015"
    networks:
      - mongo_net

  # Shard3 (optional, Profil =3) – Port 27014
  shard3:
    image: mongo:6.0
    container_name: shard3
    hostname: shard3
    command: >
      mongod --shardsvr --replSet shard3
             --port 27014 --bind_ip_all
    ports:
      - "27014:27014"
    networks:
      - mongo_net

  # mongos-Router (Standardport 27017)
  mongos:
    image: mongo:6.0
    container_name: mongos
    hostname: mongos
    depends_on:
      - configsvr1
      - configsvr2
      - configsvr3
    command: >
      mongos --configdb cfgrs/configsvr1:27019,configsvr2:27019,configsvr3:27019
             --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    networks:
      - mongo_net

networks:
  mongo_net:
    driver: bridge
